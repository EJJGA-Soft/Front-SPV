<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eef7;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="80" y="80" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="2" fill="#1e40af" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Fondo gradiente -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Patrón de puntos -->
  <rect width="1920" height="1080" fill="url(#dots)"/>
  
  <!-- Formas decorativas -->
  <circle cx="100" cy="200" r="150" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1820" cy="800" r="200" fill="#1e40af" opacity="0.08"/>
  <rect x="1500" y="100" width="300" height="300" fill="#60a5fa" opacity="0.1" transform="rotate(45 1650 250)"/>
</svg>