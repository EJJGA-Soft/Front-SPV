<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo blanco -->
  <rect width="200" height="200" fill="white"/>
  
  <!-- Círculo principal (gradiente azul) -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="85" fill="url(#blueGradient)"/>
  
  <!-- Carrito de compras simplificado -->
  <g transform="translate(100, 100)">
    <!-- Rueda izquierda -->
    <circle cx="-20" cy="35" r="8" fill="white" stroke="white" stroke-width="2"/>
    <!-- Rueda derecha -->
    <circle cx="20" cy="35" r="8" fill="white" stroke="white" stroke-width="2"/>
    
    <!-- Cuerpo del carrito -->
    <path d="M -30 20 L -25 -10 L 25 -10 L 30 20 Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Asa del carrito -->
    <path d="M -15 -10 Q 0 -25 15 -10" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Cartas/productos dentro del carrito -->
    <rect x="-22" y="-5" width="8" height="15" fill="rgba(255,255,255,0.8)" stroke="white" stroke-width="1"/>
    <rect x="-8" y="-5" width="8" height="15" fill="rgba(255,255,255,0.8)" stroke="white" stroke-width="1"/>
    <rect x="6" y="-5" width="8" height="15" fill="rgba(255,255,255,0.8)" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Texto "SPV" (Sistema Post-Ventas) -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e40af" text-anchor="middle">SPV</text>
</svg>